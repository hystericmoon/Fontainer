name: Build Desktop Installers (macOS .dmg + Windows .exe)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Hosted Fontainer web/API URL for Google Fonts, Adobe Fonts, AI Pairing & Desktop Sign-In'
        required: false
        default: ''
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build Universal macOS .dmg
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build Universal macOS .app bundle
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.FONTAINER_API_URL || 'https://fontainer-alpha.vercel.app' }}
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Package drag-to-Applications .dmg (hdiutil)
        run: |
          rm -rf dmg-stage Fontainer-macOS-Universal.dmg
          mkdir -p dmg-stage
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/Fontainer.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "Fontainer" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            Fontainer-macOS-Universal.dmg

      - name: Upload macOS .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fontainer-macOS-Universal-DMG
          path: Fontainer-macOS-Universal.dmg
          if-no-files-found: error

  build-windows-exe:
    name: Build Windows x64 .exe Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (Windows x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build Windows NSIS .exe installer
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.FONTAINER_API_URL || 'https://fontainer-alpha.vercel.app' }}
        run: npx tauri build --bundles nsis

      - name: Stage Windows .exe installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Windows NSIS installer .exe not found in src-tauri/target/release/bundle/nsis"
          }
          Copy-Item $exe.FullName -Destination "Fontainer-Windows-x64-Setup.exe" -Force

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fontainer-Windows-x64-EXE
          path: Fontainer-Windows-x64-Setup.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (macOS + Windows)
    needs: [build-macos-dmg, build-windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS .dmg
        uses: actions/download-artifact@v4
        with:
          name: Fontainer-macOS-Universal-DMG
          path: release-assets

      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: Fontainer-Windows-x64-EXE
          path: release-assets

      - name: Publish GitHub Release with .dmg and .exe
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Fontainer-macOS-Universal.dmg
            release-assets/Fontainer-Windows-x64-Setup.exe
          generate_release_notes: true
