name: Build macOS .dmg

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos-dmg:
    name: Build Universal macOS .dmg
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust (Apple Silicon + Intel)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Install Tauri v2 CLI
        run: npm install -D @tauri-apps/cli@^2 --legacy-peer-deps

      - name: Initialize Tauri macOS wrapper
        run: |
          if [ ! -d "src-tauri" ]; then
            npx tauri init --ci \
              --app-name Fontainer \
              --window-title Fontainer \
              --frontend-dist ../dist \
              --dev-url http://localhost:3000 \
              --before-dev-command "npm run dev" \
              --before-build-command "npm run build"
          fi

      - name: Configure bundle identifier and window size
        run: |
          node --input-type=module << 'EOF'
          import fs from "node:fs";
          const path = "src-tauri/tauri.conf.json";
          const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
          cfg.productName = "Fontainer";
          cfg.identifier = "com.fontainer.app";
          if (cfg.app && Array.isArray(cfg.app.windows) && cfg.app.windows[0]) {
            cfg.app.windows[0].title = "Fontainer";
            cfg.app.windows[0].width = 1360;
            cfg.app.windows[0].height = 860;
            cfg.app.windows[0].minWidth = 960;
            cfg.app.windows[0].minHeight = 620;
          }
          fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          EOF

      - name: Generate macOS app icon (.icns)
        run: npx tauri icon public/pwa-512x512.png

      - name: Build Universal macOS .app bundle
        run: npx tauri build --target universal-apple-darwin --bundles app

      - name: Package drag-to-Applications .dmg (hdiutil)
        run: |
          rm -rf dmg-stage Fontainer-macOS-Universal.dmg
          mkdir -p dmg-stage
          cp -R "src-tauri/target/universal-apple-darwin/release/bundle/macos/Fontainer.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "Fontainer" \
            -srcfolder dmg-stage \
            -ov \
            -format UDZO \
            Fontainer-macOS-Universal.dmg

      - name: Upload Fontainer .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fontainer-macOS-Universal-DMG
          path: Fontainer-macOS-Universal.dmg
          if-no-files-found: error
