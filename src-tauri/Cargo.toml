[package]
name = "fontainer"
version = "0.1.0"
description = "Cross-platform desktop font manager with real OS font activation and Firebase cloud sync."
authors = ["Fontainer"]
edition = "2021"

[lib]
name = "fontainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync"] }
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Registry",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
